name: CI Build

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]
  # 每天凌晨2点检查变更并发布nightly版本
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

env:
  JAVA_VERSION: '21'
  ANDROID_COMPILE_SDK: '35'
  GRADLE_OPTS: '-Dorg.gradle.jvmargs="-Xmx4g -XX:MaxMetaspaceSize=1g" -Dorg.gradle.parallel=true -Dorg.gradle.caching=true'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
          cache: 'gradle'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle.kts', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build debug APK
        run: |
          sed -i '/org.gradle.java.home/d' gradle.properties
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: miruplay-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 7

      - name: Upload all APKs (if multi-variant)
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: all-apks-${{ github.run_number }}
          path: app/build/outputs/apk/**/*.apk
          retention-days: 7

  build-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
          cache: 'gradle'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle.kts', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Prepare release keystore
        run: |
          test -n "$KEYSTORE_BASE64"
          test -n "$KEY_ALIAS"
          test -n "$KEY_PASSWORD"
          test -n "$STORE_PASSWORD"
          printf '%s' "$KEYSTORE_BASE64" \
            | sed '/^-----BEGIN /d;/^-----END /d' \
            | tr -d '[:space:]' \
            | base64 --decode > "$RUNNER_TEMP/miruplay-release.jks"
          keytool -list -keystore "$RUNNER_TEMP/miruplay-release.jks" -storepass "$STORE_PASSWORD" -alias "$KEY_ALIAS" >/dev/null
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}

      - name: Build release APK
        run: |
          sed -i '/org.gradle.java.home/d' gradle.properties
          ./gradlew assembleRelease --no-daemon --stacktrace
        env:
          RELEASE_STORE_FILE: ${{ runner.temp }}/miruplay-release.jks
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: miruplay-release-apk-${{ github.run_number }}
          path: app/build/outputs/apk/release/*-release.apk
          retention-days: 30

  lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
          cache: 'gradle'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run lint
        run: |
          sed -i '/org.gradle.java.home/d' gradle.properties
          ./gradlew lint --no-daemon
        continue-on-error: true

      - name: Upload lint reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lint-reports
          path: app/build/reports/lint-results-*.html
          retention-days: 7

  nightly:
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Java ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
          cache: 'gradle'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle.kts', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Check for code changes
        id: check_changes
        run: |
          # 检查过去24小时是否有代码变更
          SINCE_DATE=$(date -d '24 hours ago' '+%Y-%m-%dT%H:%M:%S')
          CHANGES=$(git log --since="$SINCE_DATE" --oneline --name-only)
          echo "Changes detected:"
          echo "$CHANGES"
          if [ -n "$CHANGES" ]; then
            echo "has_changes=true" >> $GITHUB_OUTPUT
          else
            echo "has_changes=false" >> $GITHUB_OUTPUT
          fi

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Set nightly version
        id: version
        run: |
          # 生成日期格式版本号: YYYYMMDD
          VERSION_NAME=$(date +'%Y.%m.%d')
          echo "version_name=$VERSION_NAME" >> $GITHUB_OUTPUT
          echo "version_code=$(date +'%Y%m%d')" >> $GITHUB_OUTPUT
          echo "Nightly version: $VERSION_NAME"

      - name: Prepare release keystore
        if: steps.check_changes.outputs.has_changes == 'true'
        run: |
          test -n "$KEYSTORE_BASE64"
          test -n "$KEY_ALIAS"
          test -n "$KEY_PASSWORD"
          test -n "$STORE_PASSWORD"
          printf '%s' "$KEYSTORE_BASE64" \
            | sed '/^-----BEGIN /d;/^-----END /d' \
            | tr -d '[:space:]' \
            | base64 --decode > "$RUNNER_TEMP/miruplay-release.jks"
          keytool -list -keystore "$RUNNER_TEMP/miruplay-release.jks" -storepass "$STORE_PASSWORD" -alias "$KEY_ALIAS" >/dev/null
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}

      - name: Build nightly APK
        if: steps.check_changes.outputs.has_changes == 'true'
        run: |
          sed -i '/org.gradle.java.home/d' gradle.properties
          ./gradlew assembleRelease \
            -PVERSION_NAME=${{ steps.version.outputs.version_name }} \
            -PVERSION_CODE=${{ steps.version.outputs.version_code }} \
            --no-daemon --stacktrace
        env:
          RELEASE_STORE_FILE: ${{ runner.temp }}/miruplay-release.jks
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}

      - name: Generate release notes
        id: release_notes
        if: steps.check_changes.outputs.has_changes == 'true'
        run: |
          BUILD_DATE="$(date +'%Y-%m-%d')"
          TAG_NAME="nightly-${{ steps.version.outputs.version_name }}"

          # Get commits since last nightly tag (or last 24h if no prior tag)
          PREV_TAG=$(git tag --list 'nightly-*' --sort=-version:refname | head -1)
          if [ -n "$PREV_TAG" ]; then
            CHANGES=$(git log "$PREV_TAG"..HEAD --oneline --no-decorate)
          else
            SINCE_DATE=$(date -d '24 hours ago' '+%Y-%m-%dT%H:%M:%S')
            CHANGES=$(git log --since="$SINCE_DATE" --oneline --no-decorate)
          fi

          # Build release notes file
          cat > release-notes.md << EOF
          ## Nightly Build

          **Build Date:** ${BUILD_DATE}

          ### Changes
          ${CHANGES:-No new commits since last nightly.}

          ### Downloads
          Download the APK from the artifacts below.
          EOF

          echo "Release notes written to release-notes.md"
          cat release-notes.md

      - name: Create GitHub Release
        if: steps.check_changes.outputs.has_changes == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: nightly-${{ steps.version.outputs.version_name }}
          name: Nightly ${{ steps.version.outputs.version_name }}
          body_path: release-notes.md
          files: app/build/outputs/apk/release/*-release.apk
          prerelease: true
          draft: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload nightly APK
        if: steps.check_changes.outputs.has_changes == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: miruplay-nightly-${{ steps.version.outputs.version_name }}
          path: app/build/outputs/apk/release/*-release.apk
          retention-days: 30
