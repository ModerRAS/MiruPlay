name: CI Build

on:
  push:
    branches: [ main, master, develop, 'codex/**' ]
  pull_request:
    branches: [ main, master, develop ]
  # 每天凌晨2点检查变更并发布nightly版本
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:
    inputs:
      desktop_behavior_tags:
        description: 'Windows desktop behavior tags for manual runs: smoke or full'
        required: false
        default: 'smoke'


env:
  JAVA_VERSION: '21'
  BUN_VERSION: '1.3.11'
  ANDROID_COMPILE_SDK: '35'
  GRADLE_OPTS: '-Dorg.gradle.jvmargs="-Xmx4g -XX:MaxMetaspaceSize=1g" -Dorg.gradle.parallel=true -Dorg.gradle.caching=true'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
          cache: 'gradle'

      - name: Setup Bun ${{ env.BUN_VERSION }}
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle.kts', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Run desktop and shared JVM checks
        run: >
          ./gradlew
          checkDesktopComposeOnly
          checkDesktopPresenterSeparation
          checkUiPaletteDrift
          :core:model:test
          :media-source-api:test
          :metadata-core:test
          :repository-api:test
          :media-source-desktop:test
          :metadata:test
          :scraper-core:test
          :scraper:test
          :sync-engine:test
          :web-control:test
          :scanner-desktop:test
          :repository-desktop:test
          :scraper-desktop:test
          :cloud-drive-api:test
          :sync-engine-shared:test
          :player-mpv:test
          :cloud-drive-desktop:test
          :sync-engine-desktop:test
          :sync-engine-desktop:smokeCloudDriveRssScheduler
          :desktop-app:test
          :desktop-app:installDist
          -PcloudDriveRssSchedulerDurationMs=2000
          -PcloudDriveRssSchedulerCheckIntervalMs=250
          -PcloudDriveRssSchedulerRunAfterChecks=2
          -PcloudDriveRssSchedulerReportPath=build/cloud-rss-smoke/scheduler-report.json
          -PbundleMpvRuntime=false
          --no-daemon
          --stacktrace

      - name: Assert Cloud/RSS scheduler evidence
        run: pwsh -NoProfile -ExecutionPolicy Bypass -File tools/assert-cloud-rss-scheduler-report.ps1 -ReportPath build/cloud-rss-smoke/scheduler-report.json -MinRunCount 1 -MinChecksObserved 2

      - name: Upload Cloud/RSS scheduler evidence
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: miruplay-cloud-rss-scheduler-${{ github.run_number }}
          path: build/cloud-rss-smoke/**
          retention-days: 7

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: miruplay-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 7

      - name: Upload all APKs (if multi-variant)
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: all-apks-${{ github.run_number }}
          path: app/build/outputs/apk/**/*.apk
          retention-days: 7

  windows-desktop:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
          cache: 'gradle'

      - name: Setup Bun ${{ env.BUN_VERSION }}
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Build Windows desktop ZIP
        run: .\gradlew.bat :desktop-app:test :desktop-app:distZip "-PwindowsPackageVersion=0.1.${{ github.run_number }}" -PbundleMpvRuntime=false --no-daemon --stacktrace

      - name: Upload Windows desktop ZIP
        uses: actions/upload-artifact@v4
        with:
          name: miruplay-windows-desktop-${{ github.run_number }}
          path: desktop-app/build/distributions/*.zip
          retention-days: 7

  build-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
          cache: 'gradle'

      - name: Setup Bun ${{ env.BUN_VERSION }}
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle.kts', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build version
        id: version
        run: |
          # 从 build.gradle.kts 读取 major.minor（如 0.1.0 → 0.1），patch 用 run_number
          FULL_VERSION=$(grep 'val appVersionName' app/build.gradle.kts | sed 's/.*"\(.*\)".*/\1/')
          MAJOR_MINOR=$(echo "$FULL_VERSION" | sed 's/\.[^.]*$//')
          VERSION_NAME="${MAJOR_MINOR}.${{ github.run_number }}"
          VERSION_CODE=${{ github.run_number }}
          echo "version_name=$VERSION_NAME" >> $GITHUB_OUTPUT
          echo "version_code=$VERSION_CODE" >> $GITHUB_OUTPUT
          echo "tag_name=v$VERSION_NAME" >> $GITHUB_OUTPUT

      - name: Prepare release keystore
        run: |
          test -n "$KEYSTORE_BASE64"
          test -n "$KEY_ALIAS"
          test -n "$KEY_PASSWORD"
          test -n "$STORE_PASSWORD"
          printf '%s' "$KEYSTORE_BASE64" \
            | sed '/^-----BEGIN /d;/^-----END /d' \
            | tr -d '[:space:]' \
            | base64 --decode > "$RUNNER_TEMP/miruplay-release.jks"
          keytool -list -keystore "$RUNNER_TEMP/miruplay-release.jks" -storepass "$STORE_PASSWORD" -alias "$KEY_ALIAS" >/dev/null
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}

      - name: Build release APK
        run: >
          ./gradlew assembleRelease
          -PVERSION_NAME=${{ steps.version.outputs.version_name }}
          -PVERSION_CODE=${{ steps.version.outputs.version_code }}
          --no-daemon --stacktrace
        env:
          RELEASE_STORE_FILE: ${{ runner.temp }}/miruplay-release.jks
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: miruplay-release-apk-${{ github.run_number }}
          path: app/build/outputs/apk/release/*-release.apk
          retention-days: 30

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag_name }}
          target_commitish: ${{ github.sha }}
          name: v${{ steps.version.outputs.version_name }}
          body: |
            自动构建 Release v${{ steps.version.outputs.version_name }}
          files: app/build/outputs/apk/release/*-release.apk
          fail_on_unmatched_files: true
          prerelease: false
          draft: false
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
          cache: 'gradle'

      - name: Setup Bun ${{ env.BUN_VERSION }}
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run lint
        run: ./gradlew lint --no-daemon
        continue-on-error: true

      - name: Upload lint reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lint-reports
          path: app/build/reports/lint-results-*.html
          retention-days: 7

  nightly:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      has_changes: ${{ steps.check_changes.outputs.has_changes }}
      version_name: ${{ steps.version.outputs.version_name }}
    concurrency:
      group: nightly-${{ github.ref }}
      cancel-in-progress: true
    if: >
      (github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') &&
      (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Java ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
          cache: 'gradle'

      - name: Setup Bun ${{ env.BUN_VERSION }}
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle.kts', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Check for code changes
        id: check_changes
        run: |
          # Publish only when HEAD moved since the latest nightly tag.
          # This keeps at most one nightly release per day without empty refreshes.
          LATEST_TAG=$(git tag --list 'nightly-*' --sort=-version:refname | head -1)
          if [ -n "$LATEST_TAG" ]; then
            LATEST_NIGHTLY_SHA=$(git rev-list -n 1 "$LATEST_TAG")
          else
            LATEST_NIGHTLY_SHA=""
          fi

          echo "Event: ${{ github.event_name }}"
          echo "HEAD: $GITHUB_SHA"
          echo "Latest nightly tag: ${LATEST_TAG:-none}"
          echo "Latest nightly SHA: ${LATEST_NIGHTLY_SHA:-none}"

          if [ "$LATEST_NIGHTLY_SHA" != "$GITHUB_SHA" ]; then
            echo "has_changes=true" >> $GITHUB_OUTPUT
          else
            echo "has_changes=false" >> $GITHUB_OUTPUT
          fi

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Set nightly version
        id: version
        run: |
          # 生成日期格式版本号: YYYYMMDD
          VERSION_NAME=$(date +'%Y.%m.%d')
          echo "version_name=$VERSION_NAME" >> $GITHUB_OUTPUT
          echo "version_code=$(date +'%Y%m%d')" >> $GITHUB_OUTPUT
          echo "Nightly version: $VERSION_NAME"

      - name: Prepare release keystore
        if: steps.check_changes.outputs.has_changes == 'true'
        run: |
          test -n "$KEYSTORE_BASE64"
          test -n "$KEY_ALIAS"
          test -n "$KEY_PASSWORD"
          test -n "$STORE_PASSWORD"
          printf '%s' "$KEYSTORE_BASE64" \
            | sed '/^-----BEGIN /d;/^-----END /d' \
            | tr -d '[:space:]' \
            | base64 --decode > "$RUNNER_TEMP/miruplay-release.jks"
          keytool -list -keystore "$RUNNER_TEMP/miruplay-release.jks" -storepass "$STORE_PASSWORD" -alias "$KEY_ALIAS" >/dev/null
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}

      - name: Build nightly APK
        if: steps.check_changes.outputs.has_changes == 'true'
        run: |
          ./gradlew assembleRelease \
            -PVERSION_NAME=${{ steps.version.outputs.version_name }} \
            -PVERSION_CODE=${{ steps.version.outputs.version_code }} \
            --no-daemon --stacktrace
        env:
          RELEASE_STORE_FILE: ${{ runner.temp }}/miruplay-release.jks
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}

      - name: Generate release notes
        id: release_notes
        if: steps.check_changes.outputs.has_changes == 'true'
        run: |
          BUILD_DATE="$(date +'%Y-%m-%d')"
          TAG_NAME="nightly-${{ steps.version.outputs.version_name }}"

          # Get commits since the previous nightly day. When today's release is
          # refreshed after another master push, keep the notes complete for the day.
          PREV_TAG=$(git tag --list 'nightly-*' --sort=-version:refname | grep -v "^${TAG_NAME}$" | head -1)
          if [ -n "$PREV_TAG" ]; then
            CHANGES=$(git log "$PREV_TAG"..HEAD --oneline --no-decorate)
          else
            SINCE_DATE=$(date -d '24 hours ago' '+%Y-%m-%dT%H:%M:%S')
            CHANGES=$(git log --since="$SINCE_DATE" --oneline --no-decorate)
          fi

          # Build release notes file
          cat > release-notes.md << EOF
          ## Nightly Build

          **Build Date:** ${BUILD_DATE}

          ### Changes
          ${CHANGES:-No new commits since last nightly.}

          ### Downloads
          Download the Android APK and Windows desktop ZIP from the artifacts below.
          EOF

          echo "Release notes written to release-notes.md"
          cat release-notes.md

      - name: Update nightly tag
        if: steps.check_changes.outputs.has_changes == 'true'
        run: |
          TAG_NAME="nightly-${{ steps.version.outputs.version_name }}"
          git tag -f "$TAG_NAME" "$GITHUB_SHA"
          git push --force origin "refs/tags/$TAG_NAME"

      - name: Create GitHub Release
        if: steps.check_changes.outputs.has_changes == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: nightly-${{ steps.version.outputs.version_name }}
          target_commitish: ${{ github.sha }}
          name: Nightly ${{ steps.version.outputs.version_name }}
          body_path: release-notes.md
          files: app/build/outputs/apk/release/*-release.apk
          overwrite_files: true
          fail_on_unmatched_files: true
          prerelease: true
          draft: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload nightly APK
        if: steps.check_changes.outputs.has_changes == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: miruplay-nightly-${{ steps.version.outputs.version_name }}
          path: app/build/outputs/apk/release/*-release.apk
          retention-days: 30

  nightly-windows-desktop:
    runs-on: windows-latest
    needs: nightly
    permissions:
      contents: write
    if: needs.nightly.outputs.has_changes == 'true'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
          cache: 'gradle'

      - name: Setup Bun ${{ env.BUN_VERSION }}
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Build nightly Windows desktop ZIP
        run: .\gradlew.bat :desktop-app:test :desktop-app:distZip "-PwindowsPackageVersion=${{ needs.nightly.outputs.version_name }}" -PbundleMpvRuntime=false --no-daemon --stacktrace

      - name: Upload nightly Windows desktop artifact
        uses: actions/upload-artifact@v4
        with:
          name: miruplay-windows-nightly-${{ needs.nightly.outputs.version_name }}
          path: desktop-app/build/distributions/*.zip
          retention-days: 30

      - name: Attach Windows desktop ZIP to nightly release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: nightly-${{ needs.nightly.outputs.version_name }}
          files: desktop-app/build/distributions/*.zip
          overwrite_files: true
          fail_on_unmatched_files: true
          prerelease: true
          draft: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
