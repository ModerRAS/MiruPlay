# MiruPlay Version Catalog
# https://docs.gradle.org/current/userguide/platforms.html

[versions]
agp = "8.6.0"
kotlin = "2.0.0"
compose-version = "1.2.1"
tv-material = "1.0.0-beta01"
tv-foundation = "1.0.0-beta01"
media3 = "1.8.0"
hilt = "2.52"
room = "2.6.1"
ksp = "2.0.0-1.0.21"
kotlinx-serialization = "1.6.2"
androidx-security-crypto = "1.1.0-alpha06"
okhttp = "4.12.0"
nanohttpd = "2.3.1"
jcifs-ng = "2.1.10"
zxing = "3.5.4"
coroutines = "1.7.3"
lifecycle = "2.7.0"
activity-compose = "1.8.2"
androidx-core = "1.12.0"
navigation-compose = "2.7.7"
work = "2.11.2"
grpc = "1.81.0"
protobuf = "3.25.9"
protobuf-plugin = "0.9.6"
onnxruntime = "1.25.1"
icu4j = "78.3"
jsoup = "1.23.1"
libvlc = "3.6.0"

[libraries]
# === Compose ===
androidx-compose-ui = { group = "androidx.compose.ui", name = "ui", version.ref = "compose-version" }
androidx-compose-foundation = { group = "androidx.compose.foundation", name = "foundation", version.ref = "compose-version" }
androidx-compose-material3 = { group = "androidx.compose.material3", name = "material3", version.ref = "compose-version" }
androidx-compose-material-icons-extended = { group = "androidx.compose.material", name = "material-icons-extended", version.ref = "compose-version" }
androidx-compose-runtime = { group = "androidx.compose.runtime", name = "runtime", version.ref = "compose-version" }
androidx-compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview", version.ref = "compose-version" }

# === TV ===
androidx-tv-material = { group = "androidx.tv", name = "tv-material", version.ref = "tv-material" }
androidx-tv-foundation = { group = "androidx.tv", name = "tv-foundation", version.ref = "tv-foundation" }

# === Media3 ===
androidx-media3-exoplayer = { group = "androidx.media3", name = "media3-exoplayer", version.ref = "media3" }
androidx-media3-effect = { group = "androidx.media3", name = "media3-effect", version.ref = "media3" }
androidx-media3-session = { group = "androidx.media3", name = "media3-session", version.ref = "media3" }
androidx-media3-ui = { group = "androidx.media3", name = "media3-ui", version.ref = "media3" }
androidx-media3-common = { group = "androidx.media3", name = "media3-common", version.ref = "media3" }

# === Hilt ===
dagger-hilt-android = { group = "com.google.dagger", name = "hilt-android", version.ref = "hilt" }
dagger-hilt-compiler = { group = "com.google.dagger", name = "hilt-compiler", version.ref = "hilt" }
dagger-hilt-navigation-compose = { group = "androidx.hilt", name = "hilt-navigation-compose", version = "1.2.0" }

# === Room ===
androidx-room-runtime = { group = "androidx.room", name = "room-runtime", version.ref = "room" }
androidx-room-ktx = { group = "androidx.room", name = "room-ktx", version.ref = "room" }
androidx-room-compiler = { group = "androidx.room", name = "room-compiler", version.ref = "room" }

# === Network ===
okhttp = { group = "com.squareup.okhttp3", name = "okhttp", version.ref = "okhttp" }
okhttp-logging-interceptor = { group = "com.squareup.okhttp3", name = "logging-interceptor", version.ref = "okhttp" }
okhttp-mockwebserver = { group = "com.squareup.okhttp3", name = "mockwebserver", version.ref = "okhttp" }
nanohttpd = { group = "org.nanohttpd", name = "nanohttpd", version.ref = "nanohttpd" }
grpc-okhttp = { group = "io.grpc", name = "grpc-okhttp", version.ref = "grpc" }
grpc-protobuf-lite = { group = "io.grpc", name = "grpc-protobuf-lite", version.ref = "grpc" }
grpc-stub = { group = "io.grpc", name = "grpc-stub", version.ref = "grpc" }
protobuf-javalite = { group = "com.google.protobuf", name = "protobuf-javalite", version.ref = "protobuf" }
javax-annotation-api = { group = "javax.annotation", name = "javax.annotation-api", version = "1.3.2" }

# === Security ===
androidx-security-crypto = { group = "androidx.security", name = "security-crypto", version.ref = "androidx-security-crypto" }

# === Serialization ===
kotlinx-serialization-json = { group = "org.jetbrains.kotlinx", name = "kotlinx-serialization-json", version.ref = "kotlinx-serialization" }
kotlinx-serialization-core = { group = "org.jetbrains.kotlinx", name = "kotlinx-serialization-core", version.ref = "kotlinx-serialization" }
icu4j = { group = "com.ibm.icu", name = "icu4j", version.ref = "icu4j" }
jsoup = { group = "org.jsoup", name = "jsoup", version.ref = "jsoup" }

# === Coroutines ===
kotlinx-coroutines-core = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-core", version.ref = "coroutines" }

# === Lifecycle ===
androidx-lifecycle-runtime-compose = { group = "androidx.lifecycle", name = "lifecycle-runtime-compose", version.ref = "lifecycle" }
androidx-lifecycle-viewmodel-compose = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "lifecycle" }
androidx-work-runtime-ktx = { group = "androidx.work", name = "work-runtime-ktx", version.ref = "work" }

# === Activity Compose ===
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activity-compose" }
androidx-core = { group = "androidx.core", name = "core", version.ref = "androidx-core" }

# === Navigation Compose ===
androidx-navigation-compose = { group = "androidx.navigation", name = "navigation-compose", version.ref = "navigation-compose" }

# === Testing ===
junit = { group = "junit", name = "junit", version = "4.13.2" }
androidx-test-core = { group = "androidx.test", name = "core", version = "1.5.0" }
androidx-test-runner = { group = "androidx.test", name = "runner", version = "1.5.2" }
mockk = { group = "io.mockk", name = "mockk", version = "1.13.10" }
turbine = { group = "app.cash.turbine", name = "turbine", version = "1.0.0" }
robolectric = { group = "org.robolectric", name = "robolectric", version = "4.12.1" }
androidx-compose-ui-test = { group = "androidx.compose.ui", name = "ui-test-junit4" }
androidx-testing-compose = { group = "androidx.compose.ui", name = "ui-test-manifest" }

# === JCIFS ===
jcifs-ng = { group = "eu.agno3.jcifs", name = "jcifs-ng", version.ref = "jcifs-ng" }

# === QR Code ===
zxing-core = { group = "com.google.zxing", name = "core", version.ref = "zxing" }
onnxruntime-android = { group = "com.microsoft.onnxruntime", name = "onnxruntime-android", version.ref = "onnxruntime" }
videolan-libvlc-all = { group = "org.videolan.android", name = "libvlc-all", version.ref = "libvlc" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
hilt = { id = "com.google.dagger.hilt.android", version.ref = "hilt" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
protobuf = { id = "com.google.protobuf", version.ref = "protobuf-plugin" }

[bundles]
compose = ["androidx-compose-ui", "androidx-compose-foundation", "androidx-compose-material3", "androidx-compose-runtime"]
media3 = ["androidx-media3-exoplayer", "androidx-media3-session", "androidx-media3-common"]
room = ["androidx-room-runtime", "androidx-room-ktx"]
testing = ["junit", "mockk", "turbine", "androidx-compose-ui-test"]
